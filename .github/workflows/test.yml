name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"   # = the image's python (Dockerfile)
      # The image builds fine with broken Python; it just dies on start.
      - run: python -m compileall -q api
      # Standard library only: no pip install needed for the unit tests.
      - run: python -m unittest discover -s api -p 'test_*.py' -v

  page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
