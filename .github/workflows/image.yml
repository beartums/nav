name: image

# Multi-arch images (the API and the page together) to ghcr.io/<owner>/nav:
#   sha-<full sha>   every push to main (and tags) -- immutable
#   vX.Y.Z           when a vX.Y.Z tag is pushed -- what a deployment pins
#   latest           main, for convenience; never what a cluster should run
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s api -p 'test_*.py'

      # amd64 AND arm64: a pod that lands on a Raspberry Pi needs arm64.
      # Every dependency ships arm64 wheels, so QEMU only emulates.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nav
          tags: |
            type=sha,format=long
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: when
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            NAV_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            NAV_BUILT_AT=${{ steps.when.outputs.iso }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
